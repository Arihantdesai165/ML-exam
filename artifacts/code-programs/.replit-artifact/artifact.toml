kind = "web"
previewPath = "/"
title = "Code Programs"
version = "1.0.0"
id = "artifacts/code-programs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22598

[services.development]
run = "pnpm --filter @workspace/code-programs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-programs", "run", "build" ]
publicDir = "artifacts/code-programs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22598"
BASE_PATH = "/"
